<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Zen+Maru+Gothic:wght@700;900&family=Dela+Gothic+One&display=swap"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;background:#f3ecdf;font-family:"Zen Kaku Gothic New",sans-serif;color:#2a2f3d}
.hd{position:relative;height:178px;background:radial-gradient(circle at 12% 20%,#fff7e8 0,transparent 40%),linear-gradient(160deg,#fff3df 0%,#ffe2cc 55%,#ffd3bf 100%);overflow:hidden;padding:26px 36px 0}
.hd .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(232,140,110,.18) 2.2px,transparent 2.6px);background-size:26px 26px;background-position:0 0}
.hd .gh{position:absolute;left:0;right:0;bottom:0;height:26px;background-color:#fff;background-image:linear-gradient(90deg,rgba(226,92,80,.55) 50%,transparent 50%),linear-gradient(rgba(226,92,80,.55) 50%,transparent 50%);background-size:26px 26px;border-top:3px solid #fff}
.hd .gh::after{content:"";position:absolute;left:0;right:0;top:-9px;height:9px;background:radial-gradient(circle at 9px 0,transparent 8px,#fff 8.5px) 0 0/18px 9px repeat-x;transform:rotate(180deg)}
.kick{position:relative;display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 14px 5px 6px;color:#8a4b2e;font-family:"Zen Maru Gothic";font-weight:700;font-size:15px;box-shadow:0 2px 0 rgba(160,90,60,.15)}
.kick i{font-style:normal;background:#e2685a;color:#fff;border-radius:999px;padding:2px 10px;font-size:13px}
.hd h1{position:relative;font-family:"Zen Maru Gothic";font-weight:900;font-size:52px;line-height:1.15;color:#5b3424;margin-top:10px;letter-spacing:.04em;paint-order:stroke;-webkit-text-stroke:8px #fff;text-shadow:0 4px 0 rgba(200,110,80,.25)}
.hd h1 em{font-style:normal;color:#e2685a}
.fly{position:absolute;inset:0}.ft{position:absolute;height:auto;aspect-ratio:233/119;border-radius:7px;border:2.5px solid #fbe3a6;box-shadow:0 5px 10px rgba(150,80,50,.25)}.ft.pu{border-color:#cdb2f7}
.lgd{display:flex;flex-wrap:nowrap;justify-content:space-between;gap:8px 12px;padding:18px 24px 6px}
.lg{display:flex;align-items:center;gap:5px;font-size:14px;white-space:nowrap}.lg .t{width:30px;height:30px}.lg b{font-weight:900}.lg i{font-style:normal;color:#555b69;font-weight:500}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:10px 20px 22px;align-items:start}
.col h2{display:flex;justify-content:space-between;align-items:baseline;color:#fff;border-radius:10px;padding:11px 14px;margin-bottom:8px}
.col h2 span{font-family:"Dela Gothic One";font-weight:400;font-size:21px;letter-spacing:.04em}
.col h2 small{font-weight:700;font-size:13px;opacity:.92}
.org h2{background:linear-gradient(135deg,#7a54c9,#5a3aa0)}.gld h2{background:linear-gradient(135deg,#d6a535,#b07f1e)}.sky h2{background:linear-gradient(135deg,#3f55bb,#283a8c)}.wht h2{background:linear-gradient(135deg,#349488,#226d64)}.nij h2{background:linear-gradient(120deg,#d9548f,#9450c8 50%,#3d7fcf)}
.r{display:flex;align-items:center;gap:8px;background:#fffdf8;border:1px solid #e0d6c3;border-radius:9px;padding:6px 12px 6px 10px;margin-bottom:6px;height:62px}
.r.top{background:#fff8ec;border-color:#e6c9a0}
.st{width:42px;flex:none;font-size:22px;font-weight:900;display:flex;align-items:baseline}
.st i{font-style:normal;font-size:16px;margin-right:1px}
.org .st{color:#6a46b8}.gld .st{color:#a8781a}.sky .st{color:#33479e}.wht .st{color:#23796f}.nij .st{color:#a8407c}
.nij{padding:0 20px 22px}.nij .g{display:grid;grid-template-columns:repeat(4,1fr);gap:0 12px}
.mid{flex:1;min-width:0}
.ts{display:flex;gap:4px}.ts .t{width:31px;height:31px}
.lb{display:block;font-size:12.5px;font-weight:700;margin-top:3px;color:#3b4150;white-space:nowrap}
.v{font-size:19px;font-weight:900;color:#2a2f3d;flex:none}
.r.top .v{color:#c0392b}
.box{background:#fffdf8;border:1px solid #e0d6c3;border-radius:10px;padding:13px 14px;margin-top:12px}
.box h3{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:900;padding-bottom:8px;border-bottom:1px dashed #d4c8b0}
.hi{width:22px;height:22px;flex:none}
.bd{word-break:keep-all;font-size:12.5px;color:#555b69;margin:7px 0 2px;font-weight:500}
.spr{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 6px;padding:9px 0;border-bottom:1px solid #eee5d4}
.fs{display:flex;gap:3px}.fs img{width:44px;height:22px;border-radius:4px;object-fit:contain;display:block}
.sv{text-align:right;line-height:1.1;font-size:17px;font-weight:900;color:#c0392b}
.sv small{display:block;font-size:11.5px}.spr .lb{grid-column:1/-1;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;font-size:12.5px;margin:0}
.ng{margin-top:9px;font-size:13px;font-weight:900;color:#c0392b}
.exr{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee5d4}.exr:last-child{border:0;padding-bottom:0}
.exr .t{width:36px;height:36px;flex:none}
.exr b{display:block;font-size:15px;font-weight:900}.exr b.gld{color:#a8781a}.exr b.sky{color:#33479e}.exr b.wht{color:#23796f}
.exr span{display:block;word-break:keep-all;overflow-wrap:anywhere;font-size:12.5px;color:#4a5060;line-height:1.55;font-weight:500}
.spr:last-child{border-bottom:0;padding-bottom:0}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>

<linearGradient id="gRb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd6e8"/><stop offset=".35" stop-color="#fff"/><stop offset=".65" stop-color="#d4f3ff"/><stop offset="1" stop-color="#e7dcff"/></linearGradient>

<symbol id="tP" viewBox="0 0 40 40"><rect x="1" y="1" width="38" height="38" rx="8" fill="url(#fP)" stroke="#4b2d93" stroke-width="1.5"/><path d="M20 11c-7 0-11 5-11 11s5 9 11 9 11-3 11-9-4-11-11-11z" fill="url(#gPch)"/><path d="M20 12c-1 5-.5 12 0 18" stroke="#b02b40" stroke-width="1" fill="none" opacity=".5"/><path d="M20 12c2-4 6-5 9-4-2 3-5 5-9 4z" fill="#5fae4e"/></symbol>

<symbol id="tW" viewBox="0 0 40 40"><rect x="1" y="1" width="38" height="38" rx="8" fill="url(#fG)" stroke="#a47313" stroke-width="1.5"/><ellipse cx="20" cy="21" rx="9.5" ry="12" fill="url(#gRb)" stroke="#b9b2c9" stroke-width=".8"/><ellipse cx="16.5" cy="16" rx="2.4" ry="3.6" fill="#fff" opacity=".9"/></symbol>
<linearGradient id="gNj" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a9a"/><stop offset=".25" stop-color="#ffc35a"/><stop offset=".45" stop-color="#8fdc6e"/><stop offset=".65" stop-color="#5bc4f0"/><stop offset=".85" stop-color="#8a6cf0"/><stop offset="1" stop-color="#c25ad8"/></linearGradient>
<symbol id="tN" viewBox="0 0 40 40"><rect x="1" y="1" width="38" height="38" rx="8" fill="url(#fG)" stroke="#a47313" stroke-width="1.5"/><circle cx="20" cy="21" r="11" fill="url(#gNj)" stroke="#7a4a9a" stroke-width=".8"/><path d="M24 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z" fill="#fff"/><path d="M15 17a6 6 0 0 1 3-2" stroke="#fff" stroke-width="1.4" stroke-linecap="round" fill="none" opacity=".85"/></symbol>
<symbol id="ifish" viewBox="0 0 24 24"><path d="M3 12c3-5 9-6 14-3l4-3v12l-4-3c-5 3-11 2-14-3z" fill="#c0564b"/><circle cx="7.5" cy="11" r="1.1" fill="#fff"/></symbol>

<header class="hd"><div class="dots"></div><div class="kick"><i>ライフアフター</i>料理の祝福 5種類（食材4枠の組み合わせ）</div><h1>祝福パターン<em>一覧表</em></h1><div class="fly"><img class="ft pu" src="murasaki-momo.png" style="left:634px;top:8px;width:80px;transform:rotate(-8deg)"><img class="ft" src="hoshi-egg.png" style="left:778px;top:14px;width:80px;transform:rotate(6deg)"><img class="ft" src="kin-momo.png" style="left:912px;top:8px;width:80px;transform:rotate(-5deg)"><img class="ft" src="hoshi-kaki.png" style="left:1036px;top:14px;width:80px;transform:rotate(9deg)"><img class="ft" src="kin-tomato.png" style="left:674px;top:49px;width:80px;transform:rotate(7deg)"><img class="ft" src="shiraaya-milk.png" style="left:808px;top:55px;width:80px;transform:rotate(-7deg)"><img class="ft" src="hoshi-suika.png" style="left:932px;top:49px;width:80px;transform:rotate(4deg)"><img class="ft" src="kin-kaki.png" style="left:1076px;top:55px;width:80px;transform:rotate(-9deg)"><img class="ft" src="hoshi-milk.png" style="left:644px;top:90px;width:80px;transform:rotate(-6deg)"><img class="ft" src="saihaku-duck.png" style="left:768px;top:96px;width:80px;transform:rotate(8deg)"><img class="ft" src="kin-pine.png" style="left:912px;top:90px;width:80px;transform:rotate(-4deg)"><img class="ft" src="hoshi-momo.png" style="left:1046px;top:96px;width:80px;transform:rotate(6deg)"></div><div class="gh"></div></header>

</body></html>
