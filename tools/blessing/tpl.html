<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;background:#f3ecdf;font-family:"Zen Kaku Gothic New",sans-serif;color:#2a2f3d}
.hd{position:relative;height:178px;background:radial-gradient(circle at 12% 20%,#fff7e8 0,transparent 40%),linear-gradient(160deg,#fff3df 0%,#ffe2cc 55%,#ffd3bf 100%);overflow:hidden;padding:26px 36px 0}
.hd .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(232,140,110,.18) 2.2px,transparent 2.6px);background-size:26px 26px;background-position:0 0}
.hd .gh{position:absolute;left:0;right:0;bottom:0;height:26px;background-color:#fff;background-image:linear-gradient(90deg,rgba(226,92,80,.55) 50%,transparent 50%),linear-gradient(rgba(226,92,80,.55) 50%,transparent 50%);background-size:26px 26px;border-top:3px solid #fff}
.hd .gh::after{content:"";position:absolute;left:0;right:0;top:-9px;height:9px;background:radial-gradient(circle at 9px 0,transparent 8px,#fff 8.5px) 0 0/18px 9px repeat-x;transform:rotate(180deg)}
.kick{position:relative;display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 14px 5px 6px;color:#8a4b2e;font-family:"Zen Maru Gothic";font-weight:700;font-size:15px;box-shadow:0 2px 0 rgba(160,90,60,.15)}
.kick i{font-style:normal;background:#e2685a;color:#fff;border-radius:999px;padding:2px 10px;font-size:13px}
.hd h1{position:relative;font-family:"Zen Maru Gothic";font-weight:900;font-size:52px;line-height:1.15;color:#5b3424;margin-top:10px;letter-spacing:.04em;paint-order:stroke;-webkit-text-stroke:8px #fff;text-shadow:0 4px 0 rgba(200,110,80,.25)}
.hd h1 em{font-style:normal;color:#e2685a}
.art{position:absolute;right:30px;top:6px;width:380px;height:150px}
.lgd{display:flex;flex-wrap:wrap;gap:8px 22px;padding:18px 28px 6px}
.lg{display:flex;align-items:center;gap:7px;font-size:15px}.lg .t{width:30px;height:30px}.lg b{font-weight:900}.lg i{font-style:normal;color:#555b69;font-weight:500}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:10px 20px 22px;align-items:start}
.col h2{display:flex;justify-content:space-between;align-items:baseline;color:#fff;border-radius:10px;padding:11px 14px;margin-bottom:8px}
.col h2 span{font-family:"Dela Gothic One";font-weight:400;font-size:21px;letter-spacing:.04em}
.col h2 small{font-weight:700;font-size:13px;opacity:.92}
.org h2{background:linear-gradient(135deg,#7a54c9,#5a3aa0)}.gld h2{background:linear-gradient(135deg,#d6a535,#b07f1e)}.sky h2{background:linear-gradient(135deg,#3f55bb,#283a8c)}.wht h2{background:linear-gradient(135deg,#349488,#226d64)}
.r{display:flex;align-items:center;gap:8px;background:#fffdf8;border:1px solid #e0d6c3;border-radius:9px;padding:6px 12px 6px 10px;margin-bottom:6px;height:62px}
.r.top{background:#fff8ec;border-color:#e6c9a0}
.st{width:42px;flex:none;font-size:22px;font-weight:900;display:flex;align-items:baseline}
.st i{font-style:normal;font-size:16px;margin-right:1px}
.org .st{color:#6a46b8}.gld .st{color:#a8781a}.sky .st{color:#33479e}.wht .st{color:#23796f}
.mid{flex:1;min-width:0}
.ts{display:flex;gap:4px}.ts .t{width:31px;height:31px}
.lb{display:block;font-size:12.5px;font-weight:700;margin-top:3px;color:#3b4150;white-space:nowrap}
.v{font-size:19px;font-weight:900;color:#2a2f3d;flex:none}
.r.top .v{color:#c0392b}
.box{background:#fffdf8;border:1px solid #e0d6c3;border-radius:10px;padding:13px 14px;margin-top:12px}
.box h3{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:900;padding-bottom:8px;border-bottom:1px dashed #d4c8b0}
.hi{width:22px;height:22px;flex:none}
.bd{word-break:keep-all;font-size:12.5px;color:#555b69;margin:7px 0 2px;font-weight:500}
.spr{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 6px;padding:9px 0;border-bottom:1px solid #eee5d4}
.fs{display:flex;gap:3px}.fs img{width:44px;height:22px;border-radius:4px;object-fit:contain;display:block}
.sv{text-align:right;line-height:1.1;font-size:17px;font-weight:900;color:#c0392b}
.sv small{display:block;font-size:11.5px}.spr .lb{grid-column:1/-1;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;font-size:12.5px;margin:0}
.ng{margin-top:9px;font-size:13px;font-weight:900;color:#c0392b}
.exr{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee5d4}.exr:last-child{border:0;padding-bottom:0}
.exr .t{width:36px;height:36px;flex:none}
.exr b{display:block;font-size:15px;font-weight:900}.exr b.gld{color:#a8781a}.exr b.sky{color:#33479e}.exr b.wht{color:#23796f}
.exr span{display:block;word-break:keep-all;overflow-wrap:anywhere;font-size:12.5px;color:#4a5060;line-height:1.55;font-weight:500}
</style></head><body>
